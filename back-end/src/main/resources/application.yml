spring:
  application:
    name: Retail-Service
  profiles:
    active: {ACTIVE_PROFILE}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true


server:
  port: 8080

